# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Layout: [DP-1 2K portrait] | [HDMI-A-1 2K landscape] | [HDMI-A-2 2K landscape]
# DP-1      BenQ GW2790QT    2560x1440@59.95Hz  at x=5120  (left,   2K portrait, transform=3 -> 1440 wide)
# HDMI-A-1  BenQ GW2790QT    2560x1440@59.95Hz  at x=6560  (middle, 2K landscape)
# HDMI-A-2  BenQ EW3270U     2560x1440@59.95Hz  at x=9120  (right,  2K landscape, 10-bit)
monitor=DP-1,2560x1440@59.95,5120x0,1.0
monitor=DP-1,transform,3
monitor=HDMI-A-1,2560x1440@59.95,6560x0,1
monitor=HDMI-A-2,2560x1440@59.95,9120x0,1,bitdepth,10

# Per-monitor workspace assignments (i3-style)
# HDMI-A-2 (left, 2K): workspaces 1-10
workspace = 1,  monitor:HDMI-A-2, default:true
workspace = 2,  monitor:HDMI-A-2
workspace = 3,  monitor:HDMI-A-2
workspace = 4,  monitor:HDMI-A-2
workspace = 5,  monitor:HDMI-A-2
workspace = 6,  monitor:HDMI-A-2
workspace = 7,  monitor:HDMI-A-2
workspace = 8,  monitor:HDMI-A-2
workspace = 9,  monitor:HDMI-A-2
workspace = 10, monitor:HDMI-A-2

# DP-1 (left, 2K portrait): workspaces 11-20
workspace = 11, monitor:DP-1, default:true
workspace = 12, monitor:DP-1
workspace = 13, monitor:DP-1
workspace = 14, monitor:DP-1
workspace = 15, monitor:DP-1
workspace = 16, monitor:DP-1
workspace = 17, monitor:DP-1
workspace = 18, monitor:DP-1
workspace = 19, monitor:DP-1
workspace = 20, monitor:DP-1

# HDMI-A-1 (right, 1080p): workspaces 21-30
workspace = 21, monitor:HDMI-A-1, default:true
workspace = 22, monitor:HDMI-A-1
workspace = 23, monitor:HDMI-A-1
workspace = 24, monitor:HDMI-A-1
workspace = 25, monitor:HDMI-A-1
workspace = 26, monitor:HDMI-A-1
workspace = 27, monitor:HDMI-A-1
workspace = 28, monitor:HDMI-A-1
workspace = 29, monitor:HDMI-A-1
workspace = 30, monitor:HDMI-A-1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ~/.config/hypr/scripts/launch-terminal.sh
$fileManager = dolphin
$menu = hyprlauncher


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
# Export session env to systemd/dbus, then bring up the graphical session so
# xdg-desktop-portal (the frontend) can start. Without this, OBS screen capture
# is missing because org.freedesktop.portal.Desktop never activates.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR; dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP; systemctl --user start hyprland-session.target xdg-desktop-portal.service
exec-once = noctalia --daemon

# Secret Service provider (org.freedesktop.secrets) for apps that store
# login tokens via libsecret (e.g. Webex, which otherwise fails right after
# sign-in with "Failed to find OS Keychain service").
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh

# Make the notification daemon + hyprctl reachable from systemd --user timers
# (daily briefing + wellbeing nudges). Needed once per session.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP

# Software KVM: share keyboard/mouse with the Mac (see monitor-switch/SETUP-kvm.md)
exec-once = lan-mouse daemon
# Reconcile the BenQ panel to wherever the lan-mouse seat is (covers the Mac->PC return path)
exec-once = ~/Documents/projects/monitor-switch/kvm-panel-follow.sh

# Local Learning Hub static site (~/learning-hub), served at localhost:8420
exec-once = ~/.config/hypr/scripts/learning-hub-server.sh


