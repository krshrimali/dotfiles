# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

cursor {
    # Keep the cursor centered while zoomed so moving the mouse pans the view
    zoom_rigid = false
}



#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:ctrl_modifier
    kb_rules =

    follow_mouse = 0

    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, hyprlock
bind = $mainMod SHIFT, M, exec, if command -v hyprshutdown >/dev/null 2>&1; then hyprshutdown; else hyprctl dispatch exit; fi
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, B, exec, google-chrome-stable
bind = $mainMod, R, exec, $menu

# Screenshot
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, T, layoutmsg, togglesplit # dwindle

# Super+D window switcher
bind = $mainMod, D, exec, rofi -show window

# Keybind viewer
bind = $mainMod, semicolon, exec, ~/.config/hypr/scripts/keybind-runner.sh

# Daily briefing: Super+N opens today's digest; Super+SHIFT+N refreshes it now
bind = $mainMod, N, exec, ~/.config/hypr/scripts/briefing-open.sh
bind = $mainMod SHIFT, N, exec, systemctl --user start briefing.service

# Monitor input: Super+I toggles right GW2790QT between PC (HDMI) and Mac (USB-C);
# Super+SHIFT+I forces it back to the PC
bind = $mainMod, I, exec, ~/Documents/projects/monitor-switch/monitor-switch.sh toggle
bind = $mainMod SHIFT, I, exec, ~/Documents/projects/monitor-switch/monitor-switch.sh pc

# Software KVM seat handoff (keyboard way; the mouse way is crossing the BenQ's
# right edge). Super+O sends keyboard/mouse to the Mac, Super+SHIFT+O brings it back.
bind = $mainMod, O, exec, ~/Documents/projects/monitor-switch/kvm-seat.sh to-mac
bind = $mainMod SHIFT, O, exec, ~/Documents/projects/monitor-switch/kvm-seat.sh to-pc

# Keyboard "gestures"
# Workspace swipe: hold to scrub through workspaces
binde = $mainMod, bracketright, workspace, e+1
binde = $mainMod, bracketleft, workspace, e-1
# Window swipe: cycle windows on the current workspace
bind = $mainMod, Tab, cyclenext,
bind = $mainMod SHIFT, Tab, cyclenext, prev
# Pinch zoom: magnify the whole desktop around the cursor (hold to keep zooming)
binde = $mainMod, equal, exec, ~/.config/hypr/scripts/zoom.sh in
binde = $mainMod, minus, exec, ~/.config/hypr/scripts/zoom.sh out
bind = $mainMod, BackSpace, exec, ~/.config/hypr/scripts/zoom.sh reset
bind = $mainMod CTRL, mouse_down, exec, ~/.config/hypr/scripts/zoom.sh in
bind = $mainMod CTRL, mouse_up, exec, ~/.config/hypr/scripts/zoom.sh out

# Keybind cheatsheet (SUPER+/): searchable list of all active binds in rofi
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/keybinds.sh

# Pan mode (SUPER+Z): modal submap to move around while zoomed.
# hjkl/arrows pan, =/- zoom, Backspace resets zoom, ESC or SUPER+Z exits.
bind = $mainMod, Z, submap, pan
bind = $mainMod, Z, exec, notify-send -t 2000 "Pan mode" "hjkl/arrows pan, =/- zoom, ESC exits"
submap = pan
binde = , h, exec, ~/.config/hypr/scripts/pan.sh left
binde = , j, exec, ~/.config/hypr/scripts/pan.sh down
binde = , k, exec, ~/.config/hypr/scripts/pan.sh up
binde = , l, exec, ~/.config/hypr/scripts/pan.sh right
binde = , left, exec, ~/.config/hypr/scripts/pan.sh left
binde = , down, exec, ~/.config/hypr/scripts/pan.sh down
binde = , up, exec, ~/.config/hypr/scripts/pan.sh up
binde = , right, exec, ~/.config/hypr/scripts/pan.sh right
binde = , equal, exec, ~/.config/hypr/scripts/zoom.sh in
binde = , minus, exec, ~/.config/hypr/scripts/zoom.sh out
bind = , BackSpace, exec, ~/.config/hypr/scripts/zoom.sh reset
bind = , escape, submap, reset
bind = , escape, exec, notify-send -t 1500 "Pan mode" "off"
bind = $mainMod, Z, submap, reset
bind = $mainMod, Z, exec, notify-send -t 1500 "Pan mode" "off"
submap = reset

# Move focus with mainMod + hjkl (vim-style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows with mainMod + SHIFT + hjkl
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Resize windows with mainMod + CTRL + hjkl
binde = $mainMod CTRL, h, resizeactive, -50 0
binde = $mainMod CTRL, l, resizeactive, 50 0
binde = $mainMod CTRL, k, resizeactive, 0 -50
binde = $mainMod CTRL, j, resizeactive, 0 50

# Switch workspaces with mainMod + [0-9] (per focused monitor, i3-style)
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/workspace.sh switch 1
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/workspace.sh switch 2
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/workspace.sh switch 3
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/workspace.sh switch 4
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/workspace.sh switch 5
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/workspace.sh switch 6
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/workspace.sh switch 7
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/workspace.sh switch 8
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/workspace.sh switch 9
bind = $mainMod, 0, exec, ~/.config/hypr/scripts/workspace.sh switch 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/workspace.sh move 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/workspace.sh move 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/workspace.sh move 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/workspace.sh move 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/workspace.sh move 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/workspace.sh move 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/workspace.sh move 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/workspace.sh move 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/workspace.sh move 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/workspace.sh move 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, R, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Middle-button drag: move with no modifier, resize with mainMod
bindm = , mouse:274, movewindow
bindm = $mainMod, mouse:274, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

layerrule {
    name = noctalia
    match:namespace = noctalia-background-.*$
    ignore_alpha = 0.5
    blur = true
    blur_popups = true
}

# ── GPU Observer ──────────────────────────────────────────────────────────────
# Super+G: toggle the floating GPU monitor panel.
# On first press the special workspace is empty — Hyprland auto-spawns kitty.
workspace = special:gpu-observer, on-created-empty:kitty --class gpu-observer --title "GPU Observer" -e gpu-observer

windowrule {
    name = gpu-observer-float
    match:class = gpu-observer

    float = yes
    size = 1200 750
    center = yes
    rounding = 16
    opacity = 0.92 override 0.92
}

# Force Counter-Strike 2 to launch on HDMI-A-1 (middle 2K monitor) in fullscreen
windowrule {
    name = cs2-fullscreen
    match:class = ^cs2$

    monitor = HDMI-A-1
    fullscreen = yes
    float = no
    immediate = yes
}

# Force Citrix Workspace sessions onto HDMI-A-1 (middle 2K monitor) only
windowrule {
    name = citrix-hdmi-a-1
    match:class = ^Wfica$

    monitor = HDMI-A-1
    # Fullscreen in Hyprland, but don't tell wfica (client state 0): its own
    # fullscreen mode spans every monitor. See ~/.local/bin/wfica-2k.
    fullscreen_state = 2 0
}

bind = $mainMod, G, togglespecialworkspace, gpu-observer

# Floating, centred reader for the daily briefing (Super+N)
windowrule {
    name = briefing-reader
    match:class = briefing

    float = yes
    size = 900 1000
    center = yes
    rounding = 16
    opacity = 0.96 override 0.96
}

xwayland {
    force_zero_scaling = true
}
